name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore unit and integration test projects
        run: |
          dotnet restore BusinessOS.UnitTests/BusinessOS.UnitTests.csproj
          dotnet restore BusinessOS.IntegrationTests/BusinessOS.IntegrationTests.csproj

      - name: Build API
        run: dotnet build BusinessOS.API/BusinessOS.API.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test BusinessOS.UnitTests/BusinessOS.UnitTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=unit-tests.trx" -p:Threshold=0

      - name: Run integration tests
        run: dotnet test BusinessOS.IntegrationTests/BusinessOS.IntegrationTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=integration-tests.trx" -p:Threshold=0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/TestResults/*.trx
            **/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14
