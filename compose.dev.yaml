# Containerized development (workflow B).
# Angular hot reload stays on the host in workflow A. This file runs optimized
# images with the Development environment so Scalar remains available.
# Project name: businessos-dev
# Frontend: http://127.0.0.1:4200
# API:      http://127.0.0.1:5162

services:
  api:
    ports:
      - "127.0.0.1:5162:8080"

  web:
    ports:
      - "127.0.0.1:4200:8080"
    volumes:
      - ../BusinessOS_UI/nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/config/app-config.dev.json:/usr/share/nginx/html/app-config.json:ro

  qdrant:
    # Loopback only, so workflow A and workflow B cannot bind 6333 at the same time.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
